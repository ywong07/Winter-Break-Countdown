<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Countdown to Winter Break</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}body{background:#092b50;color:white}.scene{position:relative;overflow:hidden;min-height:440px;padding:42px 20px 86px;display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at 50% 10%,#568db9 0%,#245987 48%,#09294d 100%)}.scene:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 10% 16%,#fff9 0 2px,transparent 3px),radial-gradient(circle at 75% 25%,#fff8 0 2px,transparent 3px),radial-gradient(circle at 40% 75%,#fff8 0 2px,transparent 3px);background-size:170px 130px;opacity:.5}.snow{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:2}.flake{position:absolute;top:-45px;left:var(--x);font-size:var(--size);opacity:var(--alpha);color:#e9f8ff;text-shadow:0 0 7px #c8efff;animation:fall var(--duration) linear infinite;animation-delay:var(--delay)}@keyframes fall{from{transform:translate3d(0,-50px,0) rotate(0deg)}to{transform:translate3d(var(--sway),560px,0) rotate(320deg)}}.snowbank{position:absolute;bottom:-70px;left:-10%;width:120%;height:125px;border-radius:50% 50% 0 0;background:#edf8ff;box-shadow:0 -8px 24px #b8e8ff55;z-index:3}.content{position:relative;z-index:4;max-width:1000px;width:100%}.heading{font-size:clamp(28px,4.5vw,48px);font-weight:900;letter-spacing:.5px;text-shadow:0 4px 15px #062b50;margin-bottom:23px}.numbers{display:flex;justify-content:center;align-items:stretch;gap:clamp(12px,3vw,34px);flex-wrap:wrap}.unit{min-width:170px;padding:5px 20px 10px;background:#082e55aa;border:1px solid #d8f0ff55;border-radius:22px;box-shadow:0 8px 22px #001b3044}.value{font-size:clamp(85px,15vw,150px);line-height:1.12;font-weight:900;text-shadow:0 5px 14px #001d40}.unitlabel{font-size:clamp(22px,3vw,33px);font-weight:900;letter-spacing:1px;color:#e4f6ff}.foot{font-size:clamp(16px,2.1vw,21px);line-height:1.5;margin-top:20px;font-weight:700;color:#f2fbff}.finish{font-size:clamp(45px,8vw,88px);font-weight:900;text-shadow:0 5px 16px #001b3a}.small{font-size:15px;opacity:.9}.scene.ended .numbers{display:none}@media(prefers-reduced-motion:reduce){.flake{animation:none;top:var(--staticY)}}@media(max-width:440px){.scene{padding:30px 12px 80px}.unit{min-width:132px;padding:5px 10px}.heading{margin-bottom:14px}}
</style></head><body><main id="scene" class="scene"><div class="snow" id="snow" aria-hidden="true"></div><div class="content"><div class="heading">❄️ COUNTDOWN TO WINTER BREAK ❄️</div><div class="numbers"><div class="unit"><div class="value" id="days">--</div><div class="unitlabel">SCHOOL DAYS</div></div><div class="unit"><div class="value" id="hours">--</div><div class="unitlabel">HOURS</div></div></div><div class="foot" id="foot">Weekends and Thanksgiving week don't count!<div class="small">Semester ends December 17, 2026 at 4:00 PM New Mexico time.</div></div></div><div class="snowbank"></div></main><script>
// Deterministic falling snow, including multiple sizes and speeds.
const snow=document.getElementById('snow');for(let i=0;i<55;i++){const f=document.createElement('span');f.className='flake';f.textContent=i%4===0?'❄':'•';f.style.setProperty('--x',((i*73+11)%100)+'%');f.style.setProperty('--size',(i%4===0?17+i%3*6:7+i%5*3)+'px');f.style.setProperty('--alpha',(.3+(i%7)*.09).toFixed(2));f.style.setProperty('--duration',(7+(i*3)%11)+'s');f.style.setProperty('--delay',(-((i*7)%20))+'s');f.style.setProperty('--sway',((i%2?1:-1)*(20+i%6*11))+'px');f.style.setProperty('--staticY',((i*47)%400)+'px');snow.appendChild(f)}
const fmt=new Intl.DateTimeFormat('en-US',{timeZone:'America/Denver',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
const dayMs=86400000;const endDay=Date.UTC(2026,11,17);function parts(){return Object.fromEntries(fmt.formatToParts(new Date()).filter(x=>x.type!=='literal').map(x=>[x.type,Number(x.value)]))}function schoolDay(t){const d=new Date(t),w=d.getUTCDay(),m=d.getUTCMonth()+1,n=d.getUTCDate(),y=d.getUTCFullYear();return w!==0&&w!==6&&!(y===2026&&m===11&&n>=23&&n<=27)}
function update(){const p=parts(),today=Date.UTC(p.year,p.month-1,p.day),sec=p.hour*3600+p.minute*60+p.second;const finished=today>endDay||(today===endDay&&sec>=16*3600);if(finished){document.getElementById('scene').classList.add('ended');document.querySelector('.heading').textContent='❄️ WINTER BREAK IS HERE! ❄️';document.getElementById('foot').textContent='🎉 You did it! Enjoy your break! 🎉';return}
// Count remaining eligible school-day seconds, treating each school day as 24 hours,
// except the final day which ends at 4 PM. Weekends and Nov 23-27 count as zero.
let remaining=0;for(let t=today;t<=endDay;t+=dayMs){if(!schoolDay(t))continue;const cutoff=t===endDay?16*3600:24*3600;remaining+=Math.max(0,cutoff-(t===today?sec:0))}
const days=Math.floor(remaining/86400),hours=Math.ceil((remaining%86400)/3600);document.getElementById('days').textContent=days;document.getElementById('hours').textContent=hours===24?0:hours;
// Hours are rounded up to avoid a distracting minutes/seconds display.
}update();setInterval(update,30000);
</script></body></html>
